id: mot17-mini

dataset:
  id: mot17-mini
  root: "assets/MOT17-mini"
  layout: mot
  box_type: aabb
  splits:
    train: "train"
  default_split: train
  classes:
    1: pedestrian
  distractors:
    2: person_on_vehicle
    7: static_person
    8: distractor
    12: reflection

download:
  runs: ""

detector:
  id: yolox_x_mot17_ablation
  model: "models/yolox_x_MOT17_ablation.pt"
  url: "https://huggingface.co/Lekim89/yolox/resolve/main/yolox_x_MOT17_ablation.pt"
  imgsz: [800, 1440]
  conf: 0.01
  classes:
    0: person

reid:
  id: lmbn_n_duke
  model: "models/lmbn_n_duke.pt"
  url: "https://example.com/reid/lmbn_n_duke.pth"
  device: ""
  half: true
  preprocess: resize
